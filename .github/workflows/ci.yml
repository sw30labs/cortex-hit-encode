name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: required docs exist
        run: |
          test -f README.md
          test -f docs/hypothesis.md
          test -f docs/adr/001-cortex-hit-encode.md
          test -f docs/adr/002-self-contained-instrument.md
          test -f docs/experiment-plan.md
          test -f docs/protocol.md
          test -f docs/non-goals.md
          test -f NOTICE.md
          test -f runs/README.md
          test -f runs/receipt.example.json
          test -f analysis/README.md
          test -f analysis/compare_encodes.py
          test -f scripts/import-weights.sh
          test -f src/cortex_hit_encode/cli.py
          test -f pyproject.toml
      - name: analysis stub exits 2 without receipts
        run: |
          set +e
          python3 analysis/compare_encodes.py
          code=$?
          set -e
          test "$code" -eq 2
      - name: language ban, primary endpoint, self-contained instrument
        run: |
          grep -q 'hit_probability' README.md
          grep -q 'hit_probability' docs/non-goals.md
          grep -q 'mean_auditory_roi_energy' docs/experiment-plan.md
          grep -q 'mean_auditory_roi_energy' docs/protocol.md
          grep -q 'mean_auditory_roi_energy' docs/hypothesis.md
          grep -q 'che doctor' docs/protocol.md
          grep -q 'che render --audio' README.md
          grep -q 'scripts/import-weights.sh' README.md
          ! grep -q 'sibling VideoCortex CLI' README.md
          ! grep -q 'videocortex doctor' README.md
          ! grep -q 'videocortex render' README.md
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg for doctor --renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: install package (renderer extra only — no weights)
        run: python -m pip install -e '.[dev]'
      - name: CLI help
        run: |
          che --help
          cortex-hit-encode --help
          che doctor --help
          che render --help
      - name: doctor offline renderer path
        run: che doctor --offline --renderer
      - name: import-weights help + syntax
        run: |
          bash -n scripts/import-weights.sh
          scripts/import-weights.sh --help
      - name: unit tests (no slow raster / no weights)
        run: python -m pytest -m "not slow"
