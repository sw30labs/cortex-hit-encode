[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-hit-encode"
version = "0.1.0"
description = "Self-contained TRIBE v2 encode instrument for the cortex-hit-encode experiment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolas Cravino" }]
keywords = ["fmri", "brain-encoding", "neuroscience", "tribe", "fsaverage5"]

# Renderer + doctor. The predict extra pulls torch and tribev2.
dependencies = [
  "numpy==2.2.6",
  "nilearn==0.14.1",
  "nibabel==5.4.2",
  "matplotlib==3.11.2",
  "scipy==1.17.1",
  "pillow==11.3.0",
  "huggingface_hub==1.16.1",
]

[project.optional-dependencies]
predict = [
  "tribev2 @ git+https://github.com/facebookresearch/tribev2.git",
  "torch==2.6.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
che = "cortex_hit_encode.cli:main"
cortex-hit-encode = "cortex_hit_encode.cli:main"

[project.urls]
Homepage = "https://github.com/sw30labs/cortex-hit-encode"
UpstreamInstrument = "https://github.com/sw30labs/videocortex"
Weights = "https://huggingface.co/facebook/tribev2"
Paper = "https://arxiv.org/abs/2605.04326"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: needs network or the full model stack",
]
